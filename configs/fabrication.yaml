schema_version: 1
# Development parameters only; the pen/mount have not been measured.
simulation_only: true
wireprint:
  # Geometric descent angle from horizontal, not tool tilt.
  maximum_descent_angle_deg: 27.0
  layer_height: 0.01
  zigzag_spacing: 0.025
  # Every loop gets at least this many risers and diagonals. A narrow part
  # (a pillar) is sliced thinner where its loops are too short to hold them
  # within the descent angle, down to 3 mm layers.
  minimum_connectors: 4
  # A grid of lines across each outline on the bed: a base that grips the bed
  # along more than its outline and cannot be pushed out of shape.
  base_line_spacing: 0.020
  # Coil tower: a run of outlines no wider than this that ends without
  # widening again is wound as one strand climbing coil_pitch per turn. At the
  # strand's own thickness the turns touch and form a thin tube.
  coil_maximum_width: 0.010
  coil_pitch: 0.001
  # The mesh is shrunk until its wireframe needs no more wire than this.
  maximum_wire_m: 10.0
  # Tried in order when the frame fails the structural screen. Assumes a
  # 1.5 mm tip for the pen, which is not yet on hand.
  heavier_strands_m: [0.0015]
graph:
  strand_diameter_m: 0.001
  junction_tolerance_m: 0.00075
  flatten_tolerance_m: 0.00005
  sampling_chord_m: 0.003
  minimum_crossing_angle_deg: 15
  ground_tolerance_m: 0.0005
  maximum_connector_m: 0.035
  maximum_brace_m: 0.05
  maximum_braces: 12
structure:
  calibrated: false
  material_label: 3D pen PLA, typical published values, not measured
  young_modulus_pa: 2500000000
  poisson_ratio: 0.35
  density_kg_m3: 1240
  yield_stress_pa: 15000000
  joint_model: rigid_unverified
  element_length_m: 0.008
  maximum_displacement_m: 0.001
  maximum_linear_deflection_ratio: 0.1
process:
  calibrated: false
  pen_model: null
  calibration_data: null
  # Unknown capabilities are not automatic failures. Populate from pen tests.
  minimum_stroke_m: null
  maximum_free_tip_length_m: null
  maximum_horizontal_reach_m: null
  maximum_downward_motion_m: null
  minimum_curvature_radius_m: null
  cooled_anchor_age_s: null
  # Timing assumptions only, not measurements or pen specifications.
  nominal_speed_m_s: 0.030
  vertex_cooling_s: 1.0
  # Hold after a rising member only. A falling member ends on solid wire and
  # is assumed to need no hold; wireprint_nonhorizontal_edge_end holds at both.
  vertex_cooling_policy: rising_edge_end
  vertex_feed_policy: stop_with_lag_then_restart
  join_s: 1.0
  stop_lag_s: 0.5
  start_lag_s: 0.5
  strand_diameter_m: 0.001
planning:
  # Cooling is a development assumption because the pen profile is not measured.
  assumed_cooling_s: 2.0
  maximum_subdivision_depth: 20
