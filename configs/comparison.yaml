schema_version: 1
resolution: 192
# Fixed validation views, separate from WIR3D's regularly spaced training views.
azimuth_deg: [22.5, 112.5, 202.5, 292.5]
elevation_deg: [15, 45]
boundary_tolerance_m: 0.0015
keypoint_tolerance_m: 0.003
sampling_chord_m: 0.001
flatten_tolerance_m: 0.00005
target_seconds: 1800
# Scores are geometric proxies, not a claim of human recognition.
boundary_weight: 0.7
keypoint_weight: 0.3
