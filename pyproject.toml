[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pen-art"
version = "0.1.0"
description = "A tutorial: plan a wire sculpture that a robot arm draws in the air with a 3D pen"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "trimesh[easy]>=4.6,<5",
  "Pillow>=11,<13", "PyYAML>=6,<7", "networkx>=3.4,<4",
  "fast-simplification>=0.1.10,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "xacro>=2.1,<3", "python-fcl>=0.7.0.11,<0.8", "toppra==0.6.3",
  "shapely>=2,<3", "scikit-image>=0.24,<1"
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
pen-art = "pen_art.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
