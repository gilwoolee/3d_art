[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pen-art"
version = "0.1.0"
description = "Mesh abstraction and one- or two-arm spatial extrusion research workbench"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "trimesh[easy]>=4.6,<5",
  "Pillow>=11,<13", "PyYAML>=6,<7", "networkx>=3.4,<4",
  "fast-simplification>=0.1.10,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "xacro>=2.1,<3", "python-fcl>=0.7.0.11,<0.8", "toppra==0.6.3",
  "ortools>=9.12,<10", "shapely>=2,<3", "scikit-image>=0.24,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

